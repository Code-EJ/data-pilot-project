services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: usuario_teste
      POSTGRES_PASSWORD: senha_secreta
      POSTGRES_DB: uow_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
